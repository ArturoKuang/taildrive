[project]
name = "taildrive-server"
version = "0.1.0"
description = "TailDrive control plane: /v1 file API over a pluggable storage adapter"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
taildrive-server = "taildrive.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taildrive"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
