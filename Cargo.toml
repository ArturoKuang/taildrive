[workspace]
resolver = "3"
members = ["crates/taildrive-core", "crates/taildrive-ffi", "crates/taildrive-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
taildrive-core = { path = "crates/taildrive-core" }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.2"
futures-util = "0.3.34"
hex = "0.4.3"
nix = { version = "0.32.0", features = ["fs"] }
opendal = { version = "0.59.5", default-features = false, features = ["services-s3", "services-memory", "http-transport-reqwest", "executors-tokio"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream", "http2"] }
ring = "0.17.14"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = "1.54.1"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
