name: Release main

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  formal-verify:
    runs-on: [self-hosted, macOS, ARM64, macmini-ci]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure toolchain PATH
        run: |
          {
            echo "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home/bin"
            echo "/opt/homebrew/bin"
            echo "$HOME/.cargo/bin"
          } >> "$GITHUB_PATH"

      - name: Run formal verification gate before release
        env:
          CI: "true"
          JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
          TLA2TOOLS_JAR: /Users/arturokuang/ci/tools/tla2tools.jar
          TLC_WORKERS: "2"
          TLC_META_ROOT: ${{ runner.temp }}
          FORMAL_REPORT_DIR: ${{ runner.temp }}/formal-reports
        run: |
          chmod +x scripts/formal-verify.sh scripts/static-analysis.sh scripts/code-quality.sh scripts/verify-harness-guard.sh scripts/check-formal-drift.sh
          ./scripts/formal-verify.sh --mode standard

      - name: Upload formal verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taildrive-release-formal-report-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up TLC temp state
        if: always()
        run: |
          rm -rf "${{ runner.temp }}"/tlc-taildrive-*

  build-and-release:
    needs: formal-verify
    runs-on: [self-hosted, macOS, ARM64, macmini-ci]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure toolchain PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Compute release metadata
        id: meta
        run: |
          build_number=$(git rev-list --count HEAD)
          commit_sha=$(git rev-parse HEAD)
          short_sha=$(printf '%s' "$commit_sha" | cut -c1-7)
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          base_version=$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)
          version="${base_version}-main.${build_number}+${short_sha}"
          tag="main-${build_number}"

          prev_tag=$(git tag --list 'main-*' --sort=-v:refname | grep -v '^main-latest$' | head -n 1 || true)
          if [ -n "$prev_tag" ] && git rev-parse "$prev_tag" >/dev/null 2>&1; then
            notes=$(git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..HEAD" | head -n 20)
          else
            notes=$(git log --no-merges -n 10 --pretty=format:'- %s (%h)')
          fi
          if [ -z "$notes" ]; then
            notes="- $(git log -1 --pretty=format:'%s (%h)')"
          fi

          {
            echo "build_number=${build_number}"
            echo "commit_sha=${commit_sha}"
            echo "short_sha=${short_sha}"
            echo "built_at=${built_at}"
            echo "base_version=${base_version}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "notes<<EOF"
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package TailDrive server and web UI
        env:
          TAILDRIVE_CHANNEL: main
          TAILDRIVE_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          TAILDRIVE_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          TAILDRIVE_BUILT_AT: ${{ steps.meta.outputs.built_at }}
          TAILDRIVE_DIST_DIR: ${{ runner.temp }}/release-dist
        run: |
          chmod +x scripts/package-server.sh scripts/package-macos.sh
          ./scripts/package-server.sh

      - name: Package macOS TailDrive.app
        env:
          TAILDRIVE_CHANNEL: main
          TAILDRIVE_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          TAILDRIVE_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          TAILDRIVE_BUILT_AT: ${{ steps.meta.outputs.built_at }}
          TAILDRIVE_BASE_VERSION: ${{ steps.meta.outputs.base_version }}
          TAILDRIVE_DIST_DIR: ${{ runner.temp }}/release-dist
        run: |
          ./scripts/package-macos.sh

      - name: Package Android APK (if Android SDK/NDK installed)
        env:
          TAILDRIVE_CHANNEL: main
          TAILDRIVE_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          TAILDRIVE_COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          TAILDRIVE_BUILT_AT: ${{ steps.meta.outputs.built_at }}
          TAILDRIVE_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
          JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
        run: |
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ] && command -v gradle >/dev/null 2>&1; then
            if command -v rustup >/dev/null 2>&1; then
              rustup target add aarch64-linux-android
            fi
            ./clients/android/scripts/build-android-rust.sh
            (cd clients/android && gradle assembleDebug --no-daemon)
            apk_src="clients/android/app/build/outputs/apk/debug/app-debug.apk"
            if [ -f "$apk_src" ]; then
              cp "$apk_src" "${{ runner.temp }}/release-dist/TailDrive-android-arm64-${{ steps.meta.outputs.short_sha }}.apk"
            fi
          else
            echo "Android NDK/Gradle not present on runner; skipping APK."
          fi

      - name: Build and sign GitHub and server manifests
        env:
          TAILDRIVE_UPDATE_SIGNING_KEY: ${{ secrets.TAILDRIVE_UPDATE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release-dist
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, pathlib

          release_dir = pathlib.Path(os.environ["RELEASE_DIR"])
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          short_sha = os.environ["SHORT_SHA"]
          base_dl = f"https://github.com/{repo}/releases/download/{tag}"

          candidates = {
              "macos-app-arm64": release_dir / f"TailDrive-macos-arm64-{short_sha}.zip",
              "server-darwin-arm64": release_dir / f"taildrive-server-darwin-arm64-{short_sha}.tar.gz",
              "android-apk-arm64": release_dir / f"TailDrive-android-arm64-{short_sha}.apk",
          }

          gh_artifacts = {}
          server_artifacts = {}
          for key, path in candidates.items():
              if path.is_file():
                  h = hashlib.sha256()
                  with path.open("rb") as fh:
                      for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                          h.update(chunk)
                  digest = h.hexdigest()
                  size = path.stat().st_size
                  gh_artifacts[key] = {
                      "url": f"{base_dl}/{path.name}",
                      "sha256": digest,
                      "size": size,
                  }
                  server_artifacts[key] = {
                      "url": f"/v1/updates/artifacts/{path.name}",
                      "sha256": digest,
                      "size": size,
                  }

          assert "macos-app-arm64" in gh_artifacts, "missing macOS app artifact"
          assert "server-darwin-arm64" in gh_artifacts, "missing server artifact"

          base_manifest = {
              "schema_version": 1,
              "channel": "main",
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "commit_sha": os.environ["COMMIT_SHA"],
              "published_at": os.environ["BUILT_AT"],
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "notes": os.environ["NOTES"].strip(),
          }

          gh_manifest = dict(base_manifest, artifacts=gh_artifacts)
          (release_dir / "manifest.json").write_text(
              json.dumps(gh_manifest, indent=2) + "\n", encoding="utf-8"
          )

          server_manifest = dict(base_manifest, artifacts=server_artifacts)
          (release_dir / "server-manifest.json").write_text(
              json.dumps(server_manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          ./target/release/taildrive-server release-sign \
            --manifest "${{ runner.temp }}/release-dist/manifest.json" \
            --output "${{ runner.temp }}/release-dist/manifest.json.sig"
          ./target/release/taildrive-server release-sign \
            --manifest "${{ runner.temp }}/release-dist/server-manifest.json" \
            --output "${{ runner.temp }}/release-dist/server-manifest.json.sig"

      - name: Publish immutable GitHub release and update main-latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release-dist
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          assets=()
          for file in \
            "$RELEASE_DIR/TailDrive-macos-arm64-${SHORT_SHA}.zip" \
            "$RELEASE_DIR/taildrive-server-darwin-arm64-${SHORT_SHA}.tar.gz" \
            "$RELEASE_DIR/TailDrive-android-arm64-${SHORT_SHA}.apk" \
            "$RELEASE_DIR/manifest.json" \
            "$RELEASE_DIR/manifest.json.sig"
          do
            if [ -f "$file" ]; then
              assets+=("$file")
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "TailDrive ${VERSION}" \
              --notes "$NOTES"
          fi

          # Atomically update the rolling main-latest pointer AFTER immutable assets exist.
          git tag -f main-latest "$GITHUB_SHA"
          git push -f origin main-latest
          if gh release view main-latest >/dev/null 2>&1; then
            gh release edit main-latest \
              --title "TailDrive main (latest: ${VERSION})" \
              --notes "$NOTES"
            gh release upload main-latest \
              "$RELEASE_DIR/manifest.json" \
              "$RELEASE_DIR/manifest.json.sig" \
              --clobber
          else
            gh release create main-latest \
              "$RELEASE_DIR/manifest.json" \
              "$RELEASE_DIR/manifest.json.sig" \
              --title "TailDrive main (latest: ${VERSION})" \
              --notes "$NOTES"
          fi

          # Retain the 10 most recent immutable main-<N> releases for rollback.
          old_tags=$(gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -E '^main-[0-9]+$' \
            | sort -t- -k2 -nr \
            | tail -n +11 || true)
          for old_tag in $old_tags; do
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

      - name: Auto-update TailDrive server and publish local releases on macmini-ci
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-dist
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -eu
          env_file="$HOME/.taildrive/taildrive.env"
          releases_dir="$HOME/.taildrive/releases"
          bin_dir="$HOME/.local/bin"

          # 1. Auto-update taildrive-server + web UI first so server is ahead of clients.
          if [ -f "$env_file" ]; then
            if ! grep -q '^TAILDRIVE_RELEASES_DIR=' "$env_file"; then
              printf '\nTAILDRIVE_RELEASES_DIR=%s\n' "$releases_dir" >> "$env_file"
            fi
            web_dir=$(awk -F= '/^TAILDRIVE_WEB_DIR=/{print substr($0, index($0, "=")+1); exit}' "$env_file" || true)
          else
            web_dir=""
          fi

          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$RELEASE_DIR/taildrive-server-darwin-arm64-${SHORT_SHA}.tar.gz" -C "$stage"
          chmod 755 "$stage/taildrive-server"
          "$stage/taildrive-server" --version

          mkdir -p "$bin_dir"
          install -m 755 "$stage/taildrive-server" "$bin_dir/.taildrive-server.new.$$"
          mv "$bin_dir/.taildrive-server.new.$$" "$bin_dir/taildrive-server"

          if [ -n "$web_dir" ] && [ -d "$stage/web-dist" ]; then
            parent_web=$(dirname "$web_dir")
            mkdir -p "$parent_web"
            rm -rf "${web_dir}.new.$$" "${web_dir}.bak.$$"
            cp -R "$stage/web-dist" "${web_dir}.new.$$"
            if [ -e "$web_dir" ]; then
              mv "$web_dir" "${web_dir}.bak.$$"
            fi
            mv "${web_dir}.new.$$" "$web_dir"
            rm -rf "${web_dir}.bak.$$"
          fi

          # 2. Publish artifacts + signed server manifest into ~/.taildrive/releases/
          mkdir -p "$releases_dir/artifacts"
          for file in \
            "$RELEASE_DIR/TailDrive-macos-arm64-${SHORT_SHA}.zip" \
            "$RELEASE_DIR/taildrive-server-darwin-arm64-${SHORT_SHA}.tar.gz" \
            "$RELEASE_DIR/TailDrive-android-arm64-${SHORT_SHA}.apk"
          do
            if [ -f "$file" ]; then
              base=$(basename "$file")
              cp "$file" "$releases_dir/artifacts/.${base}.new.$$"
              mv "$releases_dir/artifacts/.${base}.new.$$" "$releases_dir/artifacts/${base}"
            fi
          done

          # Restart server BEFORE publishing the new manifest pointer so clients never
          # pull a newer client release before the matching server is running.
          uid=$(id -u)
          if launchctl print "gui/${uid}/com.local.taildrive-server" >/dev/null 2>&1; then
            launchctl kickstart -k "gui/${uid}/com.local.taildrive-server"
          fi

          # Atomically publish the signed server manifest pointer.
          cp "$RELEASE_DIR/server-manifest.json.sig" "$releases_dir/.manifest.json.sig.new.$$"
          mv "$releases_dir/.manifest.json.sig.new.$$" "$releases_dir/manifest.json.sig"
          cp "$RELEASE_DIR/server-manifest.json" "$releases_dir/.manifest.json.new.$$"
          mv "$releases_dir/.manifest.json.new.$$" "$releases_dir/manifest.json"

          # Keep the 5 most recent artifacts per prefix in ~/.taildrive/releases/artifacts.
          for prefix in "TailDrive-macos-arm64-" "taildrive-server-darwin-arm64-" "TailDrive-android-arm64-"; do
            python3 - "$releases_dir/artifacts" "$prefix" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          prefix = sys.argv[2]
          matches = sorted(root.glob(f"{prefix}*"), key=lambda p: p.stat().st_mtime, reverse=True)
          for old_file in matches[5:]:
              old_file.unlink(missing_ok=True)
          PY
          done
